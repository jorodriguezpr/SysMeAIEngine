<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 215" width="980" height="215" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>LoRA: frozen weight matrix plus small trainable matrices</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4da3ff"/></marker></defs><rect x="0" y="0" width="980" height="215" rx="14" fill="#0f1115"/>
      <g font-size="13" text-anchor="middle">
        <rect x="20" y="30" width="150" height="150" rx="6" fill="#1d2330" stroke="#9aa0ad"/>
        <g stroke="#2a2e3a">
          <line x1="20" y1="60" x2="170" y2="60"/><line x1="20" y1="90" x2="170" y2="90"/><line x1="20" y1="120" x2="170" y2="120"/><line x1="20" y1="150" x2="170" y2="150"/>
          <line x1="50" y1="30" x2="50" y2="180"/><line x1="80" y1="30" x2="80" y2="180"/><line x1="110" y1="30" x2="110" y2="180"/><line x1="140" y1="30" x2="140" y2="180"/>
        </g>
        <text x="95" y="20" fill="#9aa0ad">W (original weights)</text>
        <text x="95" y="198" fill="#9aa0ad" font-size="11">frozen — millions of numbers</text>
        <text x="205" y="112" fill="#e6e6e6" font-size="24">+</text>
        <rect x="240" y="30" width="22" height="150" rx="4" fill="#0f1a12" stroke="#34c759"/>
        <text x="251" y="20" fill="#34c759">B</text>
        <text x="282" y="112" fill="#e6e6e6" font-size="20">×</text>
        <rect x="300" y="94" width="150" height="22" rx="4" fill="#0f1a12" stroke="#34c759"/>
        <text x="375" y="88" fill="#34c759">A</text>
        <text x="345" y="150" fill="#34c759" font-size="11">trainable — under 1% of the size</text>
        <text x="490" y="112" fill="#e6e6e6" font-size="24">=</text>
        <rect x="530" y="30" width="150" height="150" rx="6" fill="#1d2a24" stroke="#34c759"/>
        <text x="605" y="20" fill="#e6e6e6">adapted layer</text>
      </g>
      <g font-size="12.5" fill="#9aa0ad">
        <text x="710" y="60">sft: every weight in W changes</text>
        <text x="710" y="80">(default for the small models here)</text>
        <text x="710" y="120">lora: W stays frozen, only the</text>
        <text x="710" y="140">thin A and B are trained and saved</text>
        <text x="710" y="160">as a small separate file</text>
      </g>
    </svg>
