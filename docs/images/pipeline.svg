<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 230" width="980" height="230" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Pipeline: documents, Train from Folder, search index and small model, connect on Models page, ask in Chat</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4da3ff"/></marker></defs><rect x="0" y="0" width="980" height="230" rx="14" fill="#0f1115"/>
      
      <!-- 1 documents -->
      <g transform="translate(10,55)">
        <rect width="150" height="120" rx="12" fill="#171a21" stroke="#2a2e3a"/>
        <rect x="28" y="18" width="46" height="58" rx="4" fill="#1d2330" stroke="#4da3ff"/>
        <rect x="40" y="28" width="46" height="58" rx="4" fill="#1d2330" stroke="#4da3ff"/>
        <rect x="52" y="38" width="46" height="58" rx="4" fill="#232a38" stroke="#4da3ff"/>
        <text x="75" y="70" fill="#4da3ff" font-size="11" text-anchor="middle">PDF</text>
        <text x="75" y="112" fill="#e6e6e6" font-size="13" text-anchor="middle" font-weight="600">1 · Your documents</text>
      </g>
      <line x1="165" y1="115" x2="200" y2="115" stroke="#4da3ff" stroke-width="2" marker-end="url(#ar)"/>
      <!-- 2 train from folder -->
      <g transform="translate(205,30)">
        <rect width="220" height="170" rx="12" fill="#171a21" stroke="#4da3ff"/>
        <text x="110" y="24" fill="#e6e6e6" font-size="13" text-anchor="middle" font-weight="600">2 · Train from Folder (one job)</text>
        <g font-size="11.5" fill="#cfd5df">
          <rect x="14" y="38" width="192" height="24" rx="6" fill="#1d2330"/><text x="24" y="54">Extract text (+ OCR for scans)</text>
          <rect x="14" y="68" width="192" height="24" rx="6" fill="#1d2330"/><text x="24" y="84">Clean &amp; split into chunks</text>
          <rect x="14" y="98" width="192" height="24" rx="6" fill="#1d2330"/><text x="24" y="114">Build search index (RAG)</text>
          <rect x="14" y="128" width="192" height="24" rx="6" fill="#1d2330"/><text x="24" y="144">Fine-tune a small model (optional)</text>
        </g>
      </g>
      <line x1="430" y1="115" x2="465" y2="115" stroke="#4da3ff" stroke-width="2" marker-end="url(#ar)"/>
      <!-- 3 outputs -->
      <g transform="translate(470,40)">
        <rect width="160" height="70" rx="12" fill="#0f1a12" stroke="#34c759"/>
        <text x="80" y="28" fill="#34c759" font-size="13" text-anchor="middle" font-weight="600">Search index</text>
        <text x="80" y="48" fill="#cfd5df" font-size="11" text-anchor="middle">"corpus" named after</text>
        <text x="80" y="62" fill="#cfd5df" font-size="11" text-anchor="middle">your job</text>
        <rect y="90" width="160" height="60" rx="12" fill="#171a21" stroke="#2a2e3a"/>
        <text x="80" y="115" fill="#9aa0ad" font-size="12.5" text-anchor="middle">Small trained model</text>
        <text x="80" y="133" fill="#9aa0ad" font-size="11" text-anchor="middle">(registered, optional)</text>
        <text x="80" y="-8" fill="#e6e6e6" font-size="13" text-anchor="middle" font-weight="600">3 · Results</text>
      </g>
      <line x1="635" y1="80" x2="670" y2="105" stroke="#34c759" stroke-width="2" marker-end="url(#ar)"/>
      <!-- 4 connect -->
      <g transform="translate(675,55)">
        <rect width="140" height="120" rx="12" fill="#171a21" stroke="#2a2e3a"/>
        <text x="70" y="26" fill="#e6e6e6" font-size="13" text-anchor="middle" font-weight="600">4 · Models page</text>
        <text x="70" y="52" fill="#cfd5df" font-size="11" text-anchor="middle">Answering model</text>
        <text x="70" y="68" fill="#cfd5df" font-size="11" text-anchor="middle">(local Qwen 7B)</text>
        <text x="70" y="88" fill="#4da3ff" font-size="11" text-anchor="middle">RAG corpus = your job</text>
        <rect x="45" y="96" width="50" height="16" rx="4" fill="#4da3ff"/><text x="70" y="108" fill="#08111f" font-size="10" text-anchor="middle" font-weight="700">Set</text>
      </g>
      <line x1="820" y1="115" x2="845" y2="115" stroke="#4da3ff" stroke-width="2" marker-end="url(#ar)"/>
      <!-- 5 chat -->
      <g transform="translate(850,55)">
        <rect width="120" height="120" rx="12" fill="#171a21" stroke="#2a2e3a"/>
        <text x="60" y="26" fill="#e6e6e6" font-size="13" text-anchor="middle" font-weight="600">5 · Chat</text>
        <rect x="14" y="40" width="80" height="20" rx="8" fill="#1d2330"/><text x="20" y="54" fill="#cfd5df" font-size="10">Your question?</text>
        <rect x="26" y="66" width="80" height="34" rx="8" fill="#0f1a12" stroke="#34c759"/>
        <text x="32" y="80" fill="#cfd5df" font-size="10">Answer…</text>
        <text x="32" y="94" fill="#34c759" font-size="9">[sources]</text>
      </g>
    </svg>
