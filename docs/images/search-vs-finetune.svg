<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Measured: answers fully correct out of 30 questions, by answering model</title>
<rect width="900" height="340" rx="14" fill="#0f1115"/>
<text x="24" y="34" fill="#e6e6e6" font-size="17" font-weight="600">Same documents, same search, different answering model</text>
<text x="24" y="54" fill="#9aa0ad" font-size="12.5">Measured: share of 30 questions answered fully correctly</text>
<line x1="300.0" y1="64" x2="300.0" y2="284" stroke="#2a2e3a"/>
<text x="300.0" y="302" fill="#9aa0ad" font-size="11" text-anchor="middle">0%</text>
<line x1="435.0" y1="64" x2="435.0" y2="284" stroke="#2a2e3a"/>
<text x="435.0" y="302" fill="#9aa0ad" font-size="11" text-anchor="middle">25%</text>
<line x1="570.0" y1="64" x2="570.0" y2="284" stroke="#2a2e3a"/>
<text x="570.0" y="302" fill="#9aa0ad" font-size="11" text-anchor="middle">50%</text>
<line x1="705.0" y1="64" x2="705.0" y2="284" stroke="#2a2e3a"/>
<text x="705.0" y="302" fill="#9aa0ad" font-size="11" text-anchor="middle">75%</text>
<line x1="840.0" y1="64" x2="840.0" y2="284" stroke="#2a2e3a"/>
<text x="840.0" y="302" fill="#9aa0ad" font-size="11" text-anchor="middle">100%</text>
<text x="288" y="91" fill="#cfd5df" font-size="13" text-anchor="end">Qwen 0.5B</text>
<rect x="300" y="74" width="21.6" height="24" rx="5" fill="#3a4256"/>
<text x="329.6" y="91" fill="#e6e6e6" font-size="13" font-weight="600">4%</text>
<text x="288" y="135" fill="#cfd5df" font-size="13" text-anchor="end">Qwen 1.5B</text>
<rect x="300" y="118" width="151.2" height="24" rx="5" fill="#3a4256"/>
<text x="459.2" y="135" fill="#e6e6e6" font-size="13" font-weight="600">28%</text>
<text x="288" y="179" fill="#cfd5df" font-size="13" text-anchor="end">Qwen 3B</text>
<rect x="300" y="162" width="194.4" height="24" rx="5" fill="#3a4256"/>
<text x="502.4" y="179" fill="#e6e6e6" font-size="13" font-weight="600">36%</text>
<text x="288" y="223" fill="#cfd5df" font-size="13" text-anchor="end">Qwen 7B, short answers</text>
<rect x="300" y="206" width="237.6" height="24" rx="5" fill="#2f6aa8"/>
<text x="545.6" y="223" fill="#e6e6e6" font-size="13" font-weight="600">44%</text>
<text x="288" y="267" fill="#cfd5df" font-size="13" text-anchor="end">Qwen 7B, “complete” answers (default)</text>
<rect x="300" y="250" width="361.8" height="24" rx="5" fill="#34c759"/>
<text x="669.8" y="267" fill="#e6e6e6" font-size="13" font-weight="600">67%</text>
<text x="24" y="326" fill="#9aa0ad" font-size="11.5">Fine-tuning a small model on the same book on top of this gave no measurable gain.</text>
</svg>
