<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Tokenization example</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4da3ff"/></marker></defs><rect x="0" y="0" width="900" height="150" rx="14" fill="#0f1115"/>
      <text x="10" y="30" fill="#9aa0ad" font-size="12">text</text>
      <text x="80" y="30" fill="#e6e6e6" font-size="18">unbelievable · Nicodemo</text>
      <text x="10" y="80" fill="#9aa0ad" font-size="12">tokens</text>
      <g font-size="15">
        <rect x="80" y="58" width="44" height="30" rx="6" fill="#1d3a5c"/><text x="102" y="79" fill="#e6e6e6" text-anchor="middle">un</text>
        <rect x="128" y="58" width="70" height="30" rx="6" fill="#1d4a3a"/><text x="163" y="79" fill="#e6e6e6" text-anchor="middle">believ</text>
        <rect x="202" y="58" width="56" height="30" rx="6" fill="#4a3a1d"/><text x="230" y="79" fill="#e6e6e6" text-anchor="middle">able</text>
        <rect x="300" y="58" width="56" height="30" rx="6" fill="#3a1d4a"/><text x="328" y="79" fill="#e6e6e6" text-anchor="middle">Nic</text>
        <rect x="360" y="58" width="50" height="30" rx="6" fill="#1d3a5c"/><text x="385" y="79" fill="#e6e6e6" text-anchor="middle">od</text>
        <rect x="414" y="58" width="56" height="30" rx="6" fill="#1d4a3a"/><text x="442" y="79" fill="#e6e6e6" text-anchor="middle">emo</text>
      </g>
      <text x="10" y="130" fill="#9aa0ad" font-size="12">ids</text>
      <g font-size="13" fill="#4da3ff" text-anchor="middle">
        <text x="102" y="130">403</text><text x="163" y="130">32927</text><text x="230" y="130">540</text>
        <text x="328" y="130">45</text><text x="385" y="130">375</text><text x="442" y="130">41903</text>
      </g>
      <text x="520" y="75" fill="#9aa0ad" font-size="12.5">A small model that writes "Nicodmo" picked</text>
      <text x="520" y="95" fill="#9aa0ad" font-size="12.5">a slightly wrong sequence of these pieces;</text>
      <text x="520" y="115" fill="#9aa0ad" font-size="12.5">it never "saw" the letters themselves.</text>
    </svg>
