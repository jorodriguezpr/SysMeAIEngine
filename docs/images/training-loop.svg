<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Training loop: predict, measure loss, backpropagate, update</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4da3ff"/></marker></defs><rect x="0" y="0" width="900" height="240" rx="14" fill="#0f1115"/>
      <g font-size="13" text-anchor="middle">
        <rect x="330" y="10" width="240" height="44" rx="10" fill="#1d2330" stroke="#4da3ff"/><text x="450" y="31" fill="#e6e6e6">① show text, hide the next token</text><text x="450" y="47" fill="#9aa0ad" font-size="11">a batch of rows from your dataset</text>
        <rect x="620" y="98" width="260" height="44" rx="10" fill="#1d2330" stroke="#4da3ff"/><text x="750" y="119" fill="#e6e6e6">② model predicts it</text><text x="750" y="135" fill="#9aa0ad" font-size="11">forward pass</text>
        <rect x="330" y="186" width="240" height="44" rx="10" fill="#3a1d1d" stroke="#ff453a"/><text x="450" y="207" fill="#e6e6e6">③ measure how wrong = loss</text><text x="450" y="223" fill="#9aa0ad" font-size="11">lower is better</text>
        <rect x="20" y="98" width="260" height="44" rx="10" fill="#0f1a12" stroke="#34c759"/><text x="150" y="119" fill="#e6e6e6">④ nudge every weight a little</text><text x="150" y="135" fill="#9aa0ad" font-size="11">backpropagation + gradient descent</text>
        <text x="450" y="128" fill="#4da3ff" font-size="15" font-weight="600">1 loop = 1 step</text>
        <text x="450" y="148" fill="#9aa0ad" font-size="11.5">all rows once = 1 epoch</text>
      </g>
      <g fill="none" stroke="#4da3ff" stroke-width="2" marker-end="url(#ar)">
        <path d="M575 35 Q700 40 735 92"/><path d="M745 146 Q720 205 578 208"/><path d="M325 208 Q180 205 155 148"/><path d="M160 94 Q190 40 325 35"/>
      </g>
    </svg>
