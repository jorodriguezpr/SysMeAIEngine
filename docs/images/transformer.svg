<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="900" height="170" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Transformer layer stack</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4da3ff"/></marker></defs><rect x="0" y="0" width="900" height="170" rx="14" fill="#0f1115"/>
      <g font-size="12" text-anchor="middle">
        <rect x="10" y="60" width="110" height="50" rx="8" fill="#1d2330"/><text x="65" y="90" fill="#cfd5df">token ids</text>
        <rect x="140" y="60" width="110" height="50" rx="8" fill="#1d3a5c"/><text x="195" y="90" fill="#e6e6e6">embeddings</text>
        <g>
          <rect x="270" y="20" width="400" height="130" rx="10" fill="#171a21" stroke="#4da3ff" stroke-dasharray="5 4"/>
          <text x="470" y="40" fill="#4da3ff">× N transformer layers (12 in gpt2, 28 in Qwen 7B)</text>
          <rect x="290" y="60" width="160" height="50" rx="8" fill="#1d4a3a"/><text x="370" y="82" fill="#e6e6e6">attention</text><text x="370" y="98" fill="#9aa0ad" font-size="10.5">q_proj · k_proj · v_proj</text>
          <rect x="490" y="60" width="160" height="50" rx="8" fill="#4a3a1d"/><text x="570" y="82" fill="#e6e6e6">feed-forward</text><text x="570" y="98" fill="#9aa0ad" font-size="10.5">most of the weights</text>
        </g>
        <rect x="690" y="60" width="200" height="50" rx="8" fill="#0f1a12" stroke="#34c759"/><text x="790" y="82" fill="#34c759">next-token scores</text><text x="790" y="98" fill="#9aa0ad" font-size="10.5">→ pick → repeat</text>
      </g>
      <g stroke="#4da3ff" stroke-width="2"><line x1="120" y1="85" x2="138" y2="85"/><line x1="250" y1="85" x2="288" y2="85"/><line x1="450" y1="85" x2="488" y2="85"/><line x1="650" y1="85" x2="688" y2="85"/></g>
    </svg>
